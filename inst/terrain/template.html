<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
{{CSS}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>

  <header id="masthead">
    <div id="kicker"></div>
    <h1 id="title"></h1>
  </header>

  <div id="search-wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="search" type="search" placeholder="Search places" autocomplete="off" spellcheck="false" aria-label="Search places">
    <kbd>/</kbd>
    <div id="results" hidden></div>
  </div>
  <aside id="panel" hidden aria-live="polite"></aside>

  <div id="toolbar" role="toolbar" aria-label="View controls">
    <button id="btn-reset" title="Reset view (R)" aria-label="Reset view">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
    </button>
    <button id="btn-flat" title="Toggle 2D / 3D (F)" aria-label="Toggle flat view" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M3 17l9 4 9-4M3 12l9 4 9-4M12 3l9 4-9 4-9-4z"/></svg>
    </button>
    <button id="btn-spin" title="Rotate slowly (S)" aria-label="Rotate slowly" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
    </button>
    <button id="btn-png" title="Download PNG (P)" aria-label="Download PNG">
      <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    </button>
  </div>

  <div id="legend"></div>
  <footer id="caption"></footer>
  <div id="hint">Click a place to explore · Drag to rotate · Shift-drag or arrow keys to pan · Scroll to zoom</div>
  <div id="tooltip" hidden></div>
  <div id="nogl" hidden>This map needs WebGL2, which this browser does not provide.</div>
</div>
<script type="application/json" id="terrain-data">{{DATA}}</script>
<script>
{{JS}}
</script>
</body>
</html>
