url: https://jpcompartir.github.io/LandscapeR

template:
  bootstrap: 5
  favicon: man/figures/samy_logo_small.png
  bslib:
    # SAMY Brand Colours
    bg: "#F5F5F4"
    fg: "#2C2E35"
    primary: "#B5651D"
    secondary: "#D4A574"
    success: "#7C9885"
    info: "#5B7C99"
    warning: "#D4A574"
    danger: "#8B5A6F"

    # Typography
    base_font:
      google: "Lato"
    heading_font:
      google: "Merriweather"
    code_font:
      google: "Fira Code"

    # Component Styling
    navbar-bg: "#2C2E35"
    code-bg: "#FDFDFD"
    code-color: "#5B7C99"

navbar:
  bg: dark
  structure:
    left:  [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: Get Started
      href: articles/index.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: All vignettes
        href: articles/index.html
      - text: Running Your App Locally
        href: articles/running_app_locally.html
      - text: Shiny App User Guide
        href: articles/shiny_app_user_guide.html

footer:
  structure:
    left: developed_by
    right: built_with

home:
  sidebar:
    structure: [links, license, community, citation, authors, dev]
  links:
  - text: Report an issue
    href: https://github.com/jpcompartir/LandscapeR/issues

development:
  mode: auto

reference:
- title: Navigating a Conversation
  desc: >
    One stop shop for building a Shiny app to explore a conversation
  contents:
  - '`ls_plot_static`'
  - '`ls_plot_density`'
  - '`ls_plot_group_facet`'
  - '`ls_plot_group_static`'
  - '`ls_plot_variation_matrix`'
  - '`ls_plot_group_vol_time`'
  - '`ls_plot_group_sent`'
  - '`ls_wlos`'
  - '`ls_sentiment_over_time`'

- title: Utility Functions
  desc: >
    Exported functions for use elsewhere
  contents:
  - '`column_type_checker`'
  - '`ls_link_click`'
  - '`reactive_labels`'
  - '`ls_create_note_area`'

repo:
  url:
    home: https://github.com/jpcompartir/LandscapeR
    source: https://github.com/jpcompartir/LandscapeR/tree/main
